<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.09"/>
      <stop offset="72%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.35"/>
