<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="how-it-works-title">
  <title id="how-it-works-title">DocFlow pipeline: Receive, Process, Sync, Analyse</title>
  <defs>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Stage 1: Receive -->
  <g transform="translate(0, 40)">
    <rect x="0" y="0" width="240" height="120" rx="16" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1"/>
    <rect x="100" y="16" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadow)"/>
    <path d="M120 28v12M120 28l-8 6h16l-8-6zM108 46h24v4a4 4 0 0 1-4 4h-16a4 4 0 0 1-4-4v-4z" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Receive</text>
    <text x="120" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B">DocFlow Gateway</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M252 100h36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <path d="M284 100l-6-5v10l6-5z" fill="#CBD5E1"/>

  <!-- Stage 2: Process -->
  <g transform="translate(300, 40)">
    <rect x="0" y="0" width="240" height="120" rx="16" fill="#F5F3FF" stroke="#EDE9FE" stroke-width="1"/>
    <rect x="100" y="16" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadow)"/>
    <circle cx="120" cy="36" r="6" stroke="#7C3AED" stroke-width="2"/>
    <path d="M120 42v4M120 30v2M114 36h-2M128 36h2M115.5 31.5l-1.5 1.5M126.5 31.5l1.5 1.5M115.5 40.5l-1.5-1.5M126.5 40.5l1.5-1.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Process</text>
    <text x="120" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B">DocFlow Automation</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M552 100h36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <path d="M584 100l-6-5v10l6-5z" fill="#CBD5E1"/>

  <!-- Stage 3: Sync -->
  <g transform="translate(600, 40)">
    <rect x="0" y="0" width="240" height="120" rx="16" fill="#ECFDF5" stroke="#D1FAE5" stroke-width="1"/>
    <rect x="100" y="16" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadow)"/>
    <path d="M110 36a10 10 0 0 1 14-7M130 36a10 10 0 0 1-14 7M110 36h4M130 36h-4" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Sync</text>
    <text x="120" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B">Validated outputs</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M852 100h36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <path d="M884 100l-6-5v10l6-5z" fill="#CBD5E1"/>

  <!-- Stage 4: Analyse -->
  <g transform="translate(900, 40)">
    <rect x="0" y="0" width="240" height="120" rx="16" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="1"/>
    <rect x="100" y="16" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadow)"/>
    <path d="M108 44l6-10 6 6 8-12" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Analyse</text>
    <text x="120" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B">DocFlow Analytics</text>
  </g>

  <!-- Footer caption -->
  <text x="600" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Symantum operates processing. You get validated sync — Analytics optional.</text>
</svg>
