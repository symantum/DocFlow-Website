<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none" role="img" aria-labelledby="demo-poster-title">
  <title id="demo-poster-title">DocFlow demo preview</title>
  <defs>
    <linearGradient id="demoBg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F9FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <pattern id="demoDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#demoBg)"/>
  <rect width="1280" height="720" fill="url(#demoDots)"/>
  <!-- Blurred UI mock -->
  <rect x="140" y="80" width="1000" height="560" rx="20" fill="#FFFFFF" fill-opacity="0.85" stroke="#E2E8F0"/>
  <rect x="180" y="120" width="320" height="480" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="540" y="120" width="560" height="40" rx="8" fill="#F1F5F9"/>
  <rect x="540" y="180" width="560" height="24" rx="6" fill="#F1F5F9"/>
  <rect x="540" y="220" width="480" height="24" rx="6" fill="#F1F5F9"/>
  <rect x="540" y="260" width="520" height="24" rx="6" fill="#F1F5F9"/>
  <rect x="540" y="300" width="400" height="24" rx="6" fill="#F1F5F9"/>
  <!-- Play button -->
  <circle cx="640" cy="360" r="48" fill="#0284C7" fill-opacity="0.95"/>
  <path d="M628 336l36 24-36 24V336z" fill="#FFFFFF"/>
  <text x="640" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748B">Demo video coming soon</text>
</svg>
