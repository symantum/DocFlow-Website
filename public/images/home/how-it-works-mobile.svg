<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" fill="none" role="img" aria-labelledby="how-it-works-mobile-title">
  <title id="how-it-works-mobile-title">DocFlow pipeline: Receive, Process, Sync, Analyse</title>
  <defs>
    <filter id="iconShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Stage 1 -->
  <g transform="translate(75, 0)">
    <rect x="0" y="0" width="240" height="100" rx="16" fill="#F0F9FF" stroke="#E0F2FE"/>
    <rect x="16" y="30" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadowM)"/>
    <path d="M36 42v10M36 42l-7 5h14l-7-5zM26 58h20v3a3 3 0 0 1-3 3h-14a3 3 0 0 1-3-3v-3z" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>
    <text x="72" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Receive</text>
    <text x="72" y="66" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">DocFlow Gateway</text>
  </g>
  <path d="M195 108v20" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M195 124l-5-6h10l-5 6z" fill="#CBD5E1"/>

  <!-- Stage 2 -->
  <g transform="translate(75, 132)">
    <rect x="0" y="0" width="240" height="100" rx="16" fill="#F5F3FF" stroke="#EDE9FE"/>
    <rect x="16" y="30" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadowM)"/>
    <circle cx="36" cy="46" r="5" stroke="#7C3AED" stroke-width="2"/>
    <path d="M36 51v3M36 41v1.5M31 46h-1.5M41 46h1.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Process</text>
    <text x="72" y="66" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">DocFlow Automation</text>
  </g>
  <path d="M195 240v20" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M195 256l-5-6h10l-5 6z" fill="#CBD5E1"/>

  <!-- Stage 3 -->
  <g transform="translate(75, 264)">
    <rect x="0" y="0" width="240" height="100" rx="16" fill="#ECFDF5" stroke="#D1FAE5"/>
    <rect x="16" y="30" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadowM)"/>
    <path d="M28 46a8 8 0 0 1 11-6M44 46a8 8 0 0 1-11 6" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Sync</text>
    <text x="72" y="66" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Validated outputs</text>
  </g>
  <path d="M195 372v20" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M195 388l-5-6h10l-5 6z" fill="#CBD5E1"/>

  <!-- Stage 4 -->
  <g transform="translate(75, 396)">
    <rect x="0" y="0" width="240" height="100" rx="16" fill="#FFFBEB" stroke="#FEF3C7"/>
    <rect x="16" y="30" width="40" height="40" rx="12" fill="#FFFFFF" filter="url(#iconShadowM)"/>
    <path d="M26 54l5-8 5 5 7-10" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Analyse</text>
    <text x="72" y="66" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">DocFlow Analytics</text>
  </g>
</svg>
